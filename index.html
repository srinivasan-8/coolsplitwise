<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a13">
<title>Coolsplitwise</title>
<style>
:root{--bg:#060a13;--card:rgba(18,26,46,.78);--line:rgba(110,160,255,.18);--tx:#e9efff;--mut:#8493b8;--c1:#22e3ff;--c2:#8b5cff;--pos:#2ef2a0;--neg:#ff5c8a;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-60px;z-index:-2;opacity:.35;background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/44px 44px;animation:grid 14s linear infinite;-webkit-mask-image:radial-gradient(circle at 50% 20%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 20%,#000,transparent 75%)}
body:after{content:"";position:fixed;z-index:-1;width:70vmax;height:70vmax;left:-20vmax;top:-30vmax;background:radial-gradient(circle,rgba(139,92,255,.28),transparent 60%);animation:orb 16s ease-in-out infinite alternate}
@keyframes grid{to{transform:translate(44px,44px)}}
@keyframes orb{to{transform:translate(30vw,20vh) scale(1.2)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scan{from{top:0}to{top:100%}}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes grow{from{width:0}}
@keyframes pulse{50%{box-shadow:0 8px 40px -2px var(--c2)}}
@keyframes spark{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
#app{max-width:520px;margin:auto;padding:14px 16px 160px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.logo{font:800 17px/1 var(--mono);letter-spacing:.14em;display:flex;align-items:center;gap:9px}
.logo i{width:12px;height:12px;border-radius:3px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 14px var(--c1);animation:spin 5s linear infinite}
.logo b{color:var(--c1)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;font-weight:700;color:#06101c;background:var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.08),0 0 12px -2px var(--c)}
.card,.hero{background:var(--card);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.hero{padding:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--c1),transparent);animation:scan 3.5s linear infinite}
small{display:block;color:var(--mut);font-size:12px}
.big{font:800 36px/1.15 var(--mono);margin:4px 0 14px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.split2 b{font:700 15px var(--mono)}
h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);margin:22px 2px 10px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;margin-bottom:10px;text-align:left;transition:transform .15s}
button.row:active{transform:scale(.98)}
.grow{flex:1;min-width:0}
.grow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emo{font-size:22px;width:44px;height:44px;display:grid;place-items:center;border-radius:13px;background:rgba(34,227,255,.08);border:1px solid var(--line);flex:none}
.r{text-align:right;font:700 13px var(--mono);white-space:nowrap}
.r small{font-weight:400;font-family:system-ui,sans-serif}
.in{animation:in .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;padding:14px 26px;border-radius:99px;font-weight:700;color:#04121c;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 30px -6px var(--c1);animation:pulse 2.4s infinite;z-index:5;white-space:nowrap}
.fab.low{bottom:calc(24px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(6,10,19,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:6}
nav button{flex:1;max-width:160px;padding:9px;border-radius:12px;color:var(--mut);font-size:13px}
nav button.on{color:var(--c1);background:rgba(34,227,255,.08)}
.seg{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:3px;margin:14px 0}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--mut)}
.seg .on{background:linear-gradient(135deg,rgba(34,227,255,.22),rgba(139,92,255,.22));color:var(--tx)}
input,select,textarea{width:100%;font:16px system-ui,sans-serif;color:var(--tx);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:12px;margin:6px 0;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--c1);box-shadow:0 0 0 3px rgba(34,227,255,.15)}
input[type=checkbox]{width:22px;height:22px;margin:0;padding:0;accent-color:var(--c1);flex:none}
select option{background:#101828}
textarea{min-height:120px;font:12px var(--mono)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;margin-top:10px;color:#04121c;background:linear-gradient(135deg,var(--c1),var(--c2))}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--line)}
.btn.danger{color:var(--neg)}
.btn.sm{width:auto;flex:none;padding:0 18px;margin:6px 0}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
label{font-size:12px;color:var(--mut)}
.amt{display:flex;align-items:center;gap:8px;font:800 26px var(--mono)}
.amt input{font:800 26px var(--mono)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chip{flex:none;padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;color:var(--mut)}
.chip.on{color:var(--tx);border-color:var(--c1);background:rgba(34,227,255,.1)}
.prow{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:15px;color:var(--tx);border-bottom:1px solid rgba(255,255,255,.05)}
.mini{width:96px;margin:0;padding:8px 10px;text-align:right}
.rem{font-size:13px;margin:10px 2px;min-height:18px}
#sheet{position:fixed;inset:0;z-index:20;background:rgba(2,5,12,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
#panel{width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px 18px calc(22px + env(safe-area-inset-bottom));background:#0c1324;border:1px solid var(--line);border-radius:24px 24px 0 0;animation:up .35s cubic-bezier(.2,.8,.2,1)}
#panel h2{margin:0 0 10px;font-size:19px}
#toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);padding:10px 16px;border-radius:12px;background:#17213a;border:1px solid var(--line);opacity:0;transition:.25s;z-index:30;pointer-events:none;font-size:14px;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:var(--w);border-radius:9px;background:linear-gradient(90deg,var(--c1),var(--c2));animation:grow .8s cubic-bezier(.2,.8,.2,1) both}
.empty{text-align:center;padding:34px 16px;color:var(--mut);border:1px dashed var(--line);border-radius:18px;margin-bottom:10px}
.empty b{display:block;color:var(--tx);margin-bottom:4px}
.spark{position:fixed;left:50%;top:45%;width:8px;height:8px;border-radius:2px;background:var(--c);z-index:40;pointer-events:none;animation:spark .9s ease-out forwards}
.onb{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:6px}
.onb h1{font:800 28px/1.1 var(--mono);letter-spacing:.06em;margin:14px 0 0}
.onb h1 span{color:var(--c1)}
.back{font-size:22px;padding:4px 6px 4px 0}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" onclick="if(event.target===this)closeSheet()"><div id="panel"></div></div>
<div id="toast"></div>
<script>
/* ---------- data ---------- */
const KEY='coolsplitwise.v1';
const CATS=[['🍽️','Food'],['🚕','Travel'],['🏨','Stay'],['🎟️','Fun'],['🛒','Shopping'],['⛽','Fuel'],['🍻','Drinks'],['📦','Other']];
const EMOS=['🏝️','🏔️','🚗','✈️','🏠','🎉','🍕','⛺'];
const COLORS=['#22e3ff','#8b5cff','#2ef2a0','#ff5c8a','#ffc14d','#5c9dff','#ff7a45','#c86bff'];
const MODES=[['eq','Equal'],['ex','Exact'],['pc','Percent'],['sh','Shares']];
const fresh=()=>({me:null,cur:'₹',people:[],groups:[],log:[]});
let S=load(), V={name:'home',gid:null,tab:'exp'}, D=null, GD=null;
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save – browser storage is blocked or full')}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=a=>a.reduce((x,y)=>x+y,0);
const P=id=>S.people.find(p=>p.id===id)||{name:'?',color:'#667'};
const G=id=>S.groups.find(g=>g.id===id);
const plain=id=>id===S.me?'You':P(id).name;
const nm=id=>esc(plain(id));
const toC=v=>Math.round(parseFloat(v||0)*100)||0;           // rupees text -> whole paise
const fmt=c=>(c<0?'−':'')+S.cur+(Math.abs(c)/100).toLocaleString(S.cur==='₹'?'en-IN':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const av=(id,sz=36)=>{const p=P(id);return `<span class="av" style="--c:${p.color};width:${sz}px;height:${sz}px;font-size:${Math.round(sz*.38)}px">${esc(p.name.trim().slice(0,2).toUpperCase())}</span>`};
const empty=(a,b)=>`<div class="empty in"><b>${a}</b>${b}</div>`;
function ago(ts){const m=Math.floor((Date.now()-ts)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.floor(m/60)+' h ago':Math.floor(m/1440)+' d ago'}
function log(txt){S.log.unshift({ts:Date.now(),txt})}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function sheet(h){$('#panel').innerHTML=h;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
function done(){save();closeSheet();render()}
function boom(){for(let i=0;i<26;i++){const e=document.createElement('i'),a=Math.random()*6.28,d=80+Math.random()*140;e.className='spark';e.style.cssText=`--c:${COLORS[i%8]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px`;document.body.appendChild(e);setTimeout(()=>e.remove(),900)}}
function countUp(el,to){const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/700),e=1-Math.pow(1-k,3);el.textContent=fmt(Math.round(to*e));if(k<1)requestAnimationFrame(f)})(t0)}

/* ---------- money maths (all in whole paise) ---------- */
// Split `total` by weights. Largest-remainder method: parts always add up to total exactly.
function alloc(total,w){
  const s=sum(w); if(s<=0) return w.map(()=>0);
  const raw=w.map(x=>total*x/s), out=raw.map(Math.floor);
  let left=total-sum(out);
  raw.map((r,i)=>[r-out[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]).forEach(([,i])=>{if(left>0){out[i]++;left--}});
  return out;
}
// Net position per member: positive = should get money back, negative = owes.
function balances(g){
  const b={}; g.members.forEach(m=>b[m]=0);
  const add=(k,v)=>b[k]=(b[k]||0)+v;
  g.tx.forEach(t=>{
    add(t.by,t.amt);
    if(t.type==='pay') add(t.to,-t.amt);
    else for(const k in t.split) add(k,-t.split[k]);
  });
  return b;
}
// Fewest-payments suggestion: biggest debtor pays biggest creditor.
function simplify(b){
  const cr=[],db=[];
  for(const k in b){ if(b[k]>0)cr.push([k,b[k]]); else if(b[k]<0)db.push([k,-b[k]]) }
  cr.sort((x,y)=>y[1]-x[1]); db.sort((x,y)=>y[1]-x[1]);
  const out=[]; let i=0,j=0;
  while(i<db.length&&j<cr.length){
    const m=Math.min(db[i][1],cr[j][1]);
    out.push({from:db[i][0],to:cr[j][0],amt:m});
    db[i][1]-=m; cr[j][1]-=m;
    if(!db[i][1])i++; if(!cr[j][1])j++;
  }
  return out;
}
function computeSplit(){
  const total=toC(D.amt), ids=D.g.members; let use,parts;
  if(total<=0) return {err:'Enter an amount'};
  if(D.mode==='eq'){
    use=ids.filter(i=>D.on[i]); if(!use.length) return {err:'Pick at least one person'};
    parts=alloc(total,use.map(()=>1));
  }else if(D.mode==='ex'){
    use=ids.filter(i=>toC(D.vals[i])>0); parts=use.map(i=>toC(D.vals[i]));
    const s=sum(parts); if(s!==total) return {err:`Amounts add up to ${fmt(s)} – need ${fmt(total)}`};
  }else if(D.mode==='pc'){
    use=ids.filter(i=>parseFloat(D.vals[i])>0);
    const w=use.map(i=>Math.round(parseFloat(D.vals[i])*100)), s=sum(w);
    if(s!==10000) return {err:`Percentages total ${s/100}% – need 100%`};
    parts=alloc(total,w);
  }else{
    use=ids.filter(i=>parseFloat(D.vals[i])>0); if(!use.length) return {err:'Enter shares (e.g. 1, 2, 1)'};
    parts=alloc(total,use.map(i=>Math.round(parseFloat(D.vals[i])*100)));
  }
  const split={}; use.forEach((i,k)=>split[i]=parts[k]); return {split};
}

/* ---------- views ---------- */
const VIEWS={home,group,activity,people};
function render(){
  const a=$('#app');
  if(!S.me){a.innerHTML=onboard();return}
  const html=VIEWS[V.name]();
  a.innerHTML=html+(V.name==='group'?'':nav());
  const h=$('#hero'); if(h)countUp(h,+h.dataset.v);
}
function go(n,gid){V.name=n;if(gid)V.gid=gid;render();window.scrollTo(0,0)}
function tab(t){V.tab=t;render()}
const topBar=()=>`<header><div class="logo"><i></i>COOL<b>SPLITWISE</b></div><button onclick="go('people')">${av(S.me)}</button></header>`;
const nav=()=>`<nav>${[['home','Groups'],['activity','Activity'],['people','People']].map(n=>`<button class="${V.name===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')}</nav>`;

function onboard(){return `<div class="onb in"><div class="logo"><i></i>COOL<b>SPLITWISE</b></div>
<h1>Split trips.<br><span>Zero drama.</span></h1><small style="margin:8px 0 14px">Create your profile to start. Everything is saved on this device.</small>
<input id="on" placeholder="Your name" autocomplete="name" onkeydown="if(event.key==='Enter')start()">
<button class="btn" onclick="start()">Create profile</button></div>`}
function start(){const id=addPerson($('#on').value);if(!id)return;S.me=id;save();render()}

function home(){
  let owed=0,owe=0;
  const cards=S.groups.map((g,i)=>{
    const b=balances(g)[S.me]||0; if(b>0)owed+=b; else owe-=b;
    return `<button class="card row in" style="--i:${Math.min(i,12)}" onclick="go('group','${g.id}')"><span class="emo">${g.emoji}</span>
    <span class="grow"><b>${esc(g.name)}</b><small>${g.members.length} people · ${g.tx.length} entries</small></span>
    <span class="r ${b>0?'pos':b<0?'neg':''}"><small>${b>0?'you get back':b<0?'you owe':'settled'}</small>${b?fmt(Math.abs(b)):''}</span></button>`}).join('');
  const net=owed-owe;
  return `${topBar()}<section class="hero in"><small>NET BALANCE</small>
  <div id="hero" class="big ${net>0?'pos':net<0?'neg':''}" data-v="${net}">${fmt(net)}</div>
  <div class="split2"><div><small>You are owed</small><b class="pos">${fmt(owed)}</b></div><div><small>You owe</small><b class="neg">${fmt(owe)}</b></div></div></section>
  <h3>Groups</h3>${cards||empty('No groups yet','Create one for your trip and start adding expenses.')}
  <button class="fab" onclick="groupSheet()">＋ New group</button>`;
}

function group(){
  const g=G(V.gid); if(!g){V.name='home';return home()}
  const b=balances(g), exps=g.tx.filter(t=>t.type==='exp'), total=sum(exps.map(t=>t.amt)), mine=b[S.me]||0;
  let body='';
  if(V.tab==='exp'){
    body=[...g.tx].sort((x,y)=>y.date.localeCompare(x.date)||y.ts-x.ts).map((t,i)=>{
      const st=`style="--i:${Math.min(i,12)}"`;
      if(t.type==='pay') return `<button class="card row in" ${st} onclick="paySheet('${t.id}')"><span class="emo">💸</span><span class="grow"><b>${nm(t.by)} paid ${nm(t.to)}</b><small>${t.date} · payment</small></span><span class="r">${fmt(t.amt)}</span></button>`;
      const n=(t.by===S.me?t.amt:0)-(t.split[S.me]||0);
      return `<button class="card row in" ${st} onclick="expSheet('${t.id}')"><span class="emo">${CATS[t.cat][0]}</span><span class="grow"><b>${esc(t.desc)}</b><small>${t.date} · ${nm(t.by)} paid ${fmt(t.amt)}</small></span>
      <span class="r ${n>0?'pos':n<0?'neg':''}"><small>${n>0?'you lent':n<0?'you owe':'not involved'}</small>${n?fmt(Math.abs(n)):''}</span></button>`}).join('')
      ||empty('No expenses yet','Tap “Add expense” to log the first one.');
  }else if(V.tab==='bal'){
    const mx=Math.max(1,...g.members.map(m=>Math.abs(b[m]||0))), s=simplify(b);
    body=g.members.map((m,i)=>{const v=b[m]||0;return `<div class="card row in" style="--i:${i}">${av(m)}<span class="grow"><b>${nm(m)}</b><div class="bar"><i style="--w:${Math.round(Math.abs(v)/mx*100)}%"></i></div></span>
      <span class="r ${v>0?'pos':v<0?'neg':''}"><small>${v>0?'gets back':v<0?'owes':'settled'}</small>${v?fmt(Math.abs(v)):''}</span></div>`}).join('')
    +`<h3>Who pays whom</h3>`
    +(s.map((x,i)=>`<div class="card row in" style="--i:${i}">${av(x.from,30)}<span class="grow"><b>${nm(x.from)} → ${nm(x.to)}</b><small>${fmt(x.amt)}</small></span><button class="chip on" onclick="settleSheet('${x.from}','${x.to}',${x.amt})">Settle</button></div>`).join('')
      ||empty('All settled up 🎉','Nobody owes anything in this group.'))
    +`<button class="btn ghost" onclick="settleSheet()">Record a payment</button>`;
  }else{
    const paid={},share={},cat={}; g.members.forEach(m=>{paid[m]=0;share[m]=0});
    exps.forEach(t=>{paid[t.by]=(paid[t.by]||0)+t.amt;cat[t.cat]=(cat[t.cat]||0)+t.amt;for(const k in t.split)share[k]=(share[k]||0)+t.split[k]});
    const cs=Object.keys(cat).sort((x,y)=>cat[y]-cat[x]), mx=Math.max(1,...cs.map(c=>cat[c]));
    body=`<h3>By category</h3>`+(cs.map((c,i)=>`<div class="card row in" style="--i:${i}"><span class="emo">${CATS[c][0]}</span><span class="grow"><b>${CATS[c][1]}</b><div class="bar"><i style="--w:${Math.round(cat[c]/mx*100)}%"></i></div></span><span class="r">${fmt(cat[c])}</span></div>`).join('')||empty('No data yet','Add expenses to see the breakdown.'))
    +`<h3>By person</h3>`+g.members.map((m,i)=>`<div class="card row in" style="--i:${i}">${av(m)}<span class="grow"><b>${nm(m)}</b><small>paid ${fmt(paid[m]||0)} · share ${fmt(share[m]||0)}</small></span></div>`).join('');
  }
  return `<header><button class="back" onclick="go('home')">←</button><div class="grow" style="font-weight:700;font-size:18px">${g.emoji} ${esc(g.name)}</div><button onclick="groupSheet('${g.id}')">⚙️</button></header>
  <section class="hero in"><small>GROUP SPEND</small><div class="big" id="hero" data-v="${total}">${fmt(total)}</div>
  <div class="split2"><div><small>Your position</small><b class="${mine>0?'pos':mine<0?'neg':''}">${mine>0?'get back ':mine<0?'owe ':''}${fmt(Math.abs(mine))}</b></div><div><small>People</small><b>${g.members.length}</b></div></div></section>
  <div class="seg">${[['exp','Expenses'],['bal','Balances'],['st','Stats']].map(t=>`<button class="${V.tab===t[0]?'on':''}" onclick="tab('${t[0]}')">${t[1]}</button>`).join('')}</div>
  ${body}<button class="fab low" onclick="expSheet()">＋ Add expense</button>`;
}

function activity(){return `${topBar()}<h3>Activity</h3>${S.log.map((l,i)=>`<div class="card row in" style="--i:${Math.min(i,12)}"><span class="emo">⚡</span><span class="grow"><b style="white-space:normal">${esc(l.txt)}</b><small>${ago(l.ts)}</small></span></div>`).join('')||empty('Nothing yet','Your changes will show up here.')}`}

function people(){return `${topBar()}<h3>Profiles</h3>${S.people.map((p,i)=>`<div class="card row in" style="--i:${Math.min(i,12)}">${av(p.id)}<span class="grow"><b>${esc(p.name)}</b><small>${p.id===S.me?'Active profile':'Tap Use to switch'}</small></span>
<button class="chip" onclick="renameP('${p.id}')">Rename</button>${p.id===S.me?'':`<button class="chip on" onclick="useP('${p.id}')">Use</button>`}</div>`).join('')}
<div class="two"><input id="pn" placeholder="New profile name"><button class="btn sm" onclick="newP()">Add</button></div>
<h3>Settings</h3><label>Currency<select onchange="S.cur=this.value;save();render()">${['₹','$','€','£','¥'].map(c=>`<option ${c===S.cur?'selected':''}>${c}</option>`).join('')}</select></label>
<button class="btn ghost" onclick="backup()">Copy backup code</button><button class="btn ghost" onclick="restoreSheet()">Restore from backup code</button>`}

/* ---------- people ---------- */
function addPerson(n){
  n=(n||'').trim(); if(!n){toast('Enter a name');return null}
  const ex=S.people.find(p=>p.name.toLowerCase()===n.toLowerCase()); if(ex)return ex.id;
  const p={id:uid(),name:n,color:COLORS[S.people.length%COLORS.length]}; S.people.push(p); return p.id;
}
function newP(){if(addPerson($('#pn').value)){save();render()}}
function useP(id){S.me=id;save();render();toast('Now using '+P(id).name)}
function renameP(id){const n=prompt('New name',P(id).name);if(n&&n.trim()){P(id).name=n.trim();save();render()}}
function backup(){const s=JSON.stringify(S),show=()=>sheet(`<h2>Backup code</h2><small>Copy all of this text and keep it safe.</small><textarea readonly onfocus="this.select()">${esc(s)}</textarea>`);
  if(navigator.clipboard)navigator.clipboard.writeText(s).then(()=>toast('Backup code copied'),show);else show()}
function restoreSheet(){sheet(`<h2>Restore</h2><small>Paste a backup code. This replaces everything on this device.</small><textarea id="rs" placeholder="Paste here"></textarea><button class="btn" onclick="doRestore()">Restore</button>`)}
function doRestore(){try{const o=JSON.parse($('#rs').value);if(!o.me||!Array.isArray(o.people)||!Array.isArray(o.groups))throw 0;
  if(!confirm('Replace all data on this device?'))return;S=Object.assign(fresh(),o);V={name:'home',gid:null,tab:'exp'};done();toast('Restored')}catch(e){toast('That backup code is not valid')}}

/* ---------- groups ---------- */
const used=(g,id)=>g.tx.some(t=>t.by===id||t.to===id||(t.split&&id in t.split));
function groupSheet(id){
  const g=id&&G(id); GD={id:g?id:null,name:g?g.name:'',emoji:g?g.emoji:EMOS[0],mem:new Set(g?g.members:[S.me])};
  sheet(`<h2>${g?'Edit':'New'} group</h2><input placeholder="Group name (e.g. Goa Trip)" value="${esc(GD.name)}" oninput="GD.name=this.value">
  <div class="chips" id="emos">${EMOS.map((e,i)=>`<button class="chip ${e===GD.emoji?'on':''}" onclick="setEmo(${i})">${e}</button>`).join('')}</div>
  <h3>Members</h3><div id="mem"></div>
  <div class="two"><input id="np" placeholder="Add a friend's name" onkeydown="if(event.key==='Enter')addToGroup()"><button class="btn sm" onclick="addToGroup()">Add</button></div>
  <button class="btn" onclick="saveGroup()">${g?'Save changes':'Create group'}</button>${g?`<button class="btn ghost danger" onclick="delGroup()">Delete group</button>`:''}`);
  drawMem();
}
function setEmo(i){GD.emoji=EMOS[i];document.querySelectorAll('#emos .chip').forEach((e,k)=>e.classList.toggle('on',k===i))}
function drawMem(){$('#mem').innerHTML=S.people.map(p=>`<label class="prow">${av(p.id,28)}<span class="grow">${nm(p.id)}</span><input type="checkbox" ${GD.mem.has(p.id)?'checked':''} onchange="togMem('${p.id}',this.checked)"></label>`).join('')}
function togMem(id,on){
  if(!on&&GD.id&&used(G(GD.id),id)){toast("Can't remove – this person has entries in the group");drawMem();return}
  if(on)GD.mem.add(id);else GD.mem.delete(id);
}
function addToGroup(){const id=addPerson($('#np').value);if(!id)return;GD.mem.add(id);$('#np').value='';save();drawMem()}
function saveGroup(){
  if(!GD.name.trim())return toast('Give the group a name');
  if(GD.mem.size<2)return toast('Add at least 2 people');
  const members=S.people.map(p=>p.id).filter(i=>GD.mem.has(i));
  if(GD.id){const g=G(GD.id);g.name=GD.name.trim();g.emoji=GD.emoji;g.members=members}
  else{const g={id:uid(),name:GD.name.trim(),emoji:GD.emoji,members,tx:[]};S.groups.push(g);log(`${P(S.me).name} created the group ${g.name}`);V.name='group';V.gid=g.id;V.tab='exp'}
  done();
}
function delGroup(){const g=G(GD.id);if(!confirm(`Delete "${g.name}" and all its entries?`))return;S.groups=S.groups.filter(x=>x.id!==g.id);log(`${P(S.me).name} deleted the group ${g.name}`);V.name='home';done()}

/* ---------- expenses ---------- */
function expSheet(id){
  const g=G(V.gid), t=id&&g.tx.find(x=>x.id===id);
  D=t?{id,g,desc:t.desc,amt:(t.amt/100).toFixed(2),date:t.date,cat:t.cat,by:t.by,mode:t.mode,on:{...t.on},vals:{...t.vals}}
     :{id:null,g,desc:'',amt:'',date:today(),cat:0,by:g.members.includes(S.me)?S.me:g.members[0],mode:'eq',on:Object.fromEntries(g.members.map(m=>[m,true])),vals:{}};
  sheet(`<h2>${t?'Edit':'Add'} expense</h2>
  <input placeholder="What was it for?" value="${esc(D.desc)}" oninput="D.desc=this.value">
  <div class="amt"><span>${S.cur}</span><input inputmode="decimal" placeholder="0.00" value="${D.amt}" oninput="D.amt=this.value;rem()"></div>
  <div class="chips" id="cats">${CATS.map((c,i)=>`<button class="chip ${i===D.cat?'on':''}" onclick="setCat(${i})">${c[0]} ${c[1]}</button>`).join('')}</div>
  <div class="two"><label>Paid by<select onchange="D.by=this.value">${g.members.map(m=>`<option value="${m}" ${m===D.by?'selected':''}>${nm(m)}</option>`).join('')}</select></label>
  <label>Date<input type="date" value="${D.date}" onchange="D.date=this.value"></label></div>
  <div class="seg" id="modes"></div><div id="splitbox"></div><div id="rem" class="rem"></div>
  <button class="btn" onclick="saveExp()">Save expense</button>${t?`<button class="btn ghost danger" onclick="delTx('${id}')">Delete expense</button>`:''}`);
  drawSplit();
}
function setCat(i){D.cat=i;document.querySelectorAll('#cats .chip').forEach((e,k)=>e.classList.toggle('on',k===i))}
function setMode(m){D.mode=m;D.vals={};drawSplit()}
function drawSplit(){
  $('#modes').innerHTML=MODES.map(m=>`<button class="${D.mode===m[0]?'on':''}" onclick="setMode('${m[0]}')">${m[1]}</button>`).join('');
  const ph=D.mode==='ex'?'0.00':D.mode==='pc'?'%':'shares';
  $('#splitbox').innerHTML=D.g.members.map(m=>`<label class="prow">${av(m,28)}<span class="grow">${nm(m)}</span>${D.mode==='eq'
    ?`<input type="checkbox" ${D.on[m]?'checked':''} onchange="D.on['${m}']=this.checked;rem()">`
    :`<input class="mini" inputmode="decimal" placeholder="${ph}" value="${esc(D.vals[m]??'')}" oninput="D.vals['${m}']=this.value;rem()">`}</label>`).join('');
  rem();
}
function rem(){
  const e=$('#rem'); if(!e)return; const r=computeSplit();
  if(r.err){e.className='rem neg';e.textContent=r.err}
  else{e.className='rem pos';e.textContent='✓ '+Object.keys(r.split).map(k=>`${plain(k)} ${fmt(r.split[k])}`).join(' · ')}
}
function saveExp(){
  if(!D.desc.trim())return toast('Add a description');
  const r=computeSplit(); if(r.err)return toast(r.err);
  const g=D.g, i=g.tx.findIndex(x=>x.id===D.id);
  const t={id:D.id||uid(),type:'exp',desc:D.desc.trim(),amt:toC(D.amt),by:D.by,split:r.split,mode:D.mode,on:D.on,vals:D.vals,cat:D.cat,date:D.date||today(),ts:i>=0?g.tx[i].ts:Date.now()};
  if(i>=0)g.tx[i]=t;else g.tx.push(t);
  log(`${P(S.me).name} ${i>=0?'edited':'added'} “${t.desc}” (${fmt(t.amt)}) in ${g.name}`);
  done();
}
function delTx(id){
  if(!confirm('Delete this entry?'))return;
  const g=G(V.gid), t=g.tx.find(x=>x.id===id); g.tx=g.tx.filter(x=>x.id!==id);
  log(`${P(S.me).name} deleted ${t.type==='pay'?'a payment':'“'+t.desc+'”'} in ${g.name}`); done();
}

/* ---------- settle up ---------- */
function settleSheet(from,to,amt){
  const g=G(V.gid), o=s=>g.members.map(m=>`<option value="${m}" ${m===s?'selected':''}>${nm(m)}</option>`).join('');
  sheet(`<h2>Settle up</h2><div class="two"><label>Who paid<select id="sf">${o(from||g.members[0])}</select></label><label>Paid to<select id="st">${o(to||g.members[1])}</select></label></div>
  <div class="amt"><span>${S.cur}</span><input id="sa" inputmode="decimal" placeholder="0.00" value="${amt?(amt/100).toFixed(2):''}"></div>
  <button class="btn" onclick="savePay()">Record payment</button>`);
}
function savePay(){
  const g=G(V.gid), by=$('#sf').value, to=$('#st').value, amt=toC($('#sa').value);
  if(by===to)return toast('Pick two different people');
  if(amt<=0)return toast('Enter an amount');
  g.tx.push({id:uid(),type:'pay',by,to,amt,date:today(),ts:Date.now()});
  log(`${P(by).name} paid ${P(to).name} ${fmt(amt)} in ${g.name}`); done(); boom();
}
function paySheet(id){const t=G(V.gid).tx.find(x=>x.id===id);
  sheet(`<h2>Payment</h2><p>${nm(t.by)} paid ${nm(t.to)} <b>${fmt(t.amt)}</b> on ${t.date}.</p><button class="btn ghost danger" onclick="delTx('${id}')">Delete payment</button>`)}

render();
</script>
</body>
</html>
